[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mr2s-module"
dynamic = ["version"]
description = "module for mr2s problem"
authors = [
    { name = "Lee Yohwan", email = "dldyghks123@naver.com" },
    { name = "Kim Seyeop", email = "ksy1001k96@gmail.com" },
    { name = "Jeong Yunseong", email = "me@yunseong.dev" },
]
requires-python = ">=3.11"
dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "colorama==0.4.6",
    "h11==0.16.0",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "dwave-ocean-sdk",
    "networkx",
    "numpy",
    "minorminer",
    "dwave-networkx",
]

[project.optional-dependencies]
test = [
    "pytest",
    "scipy",
    "matplotlib",
]
experiments = [
    "tabulate",
    "scipy",
    "matplotlib",
    "pandas",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.+)$"

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests (full QUBO pipeline with SA), deselect with -m 'not slow'",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # 솔버·평가기 기본 인스턴스를 인자 기본값으로 주입하는 패턴을 허용
    "B008",
]
# 한국어 문서의 수학 기호(−, ×, –)는 오탐이므로 허용
allowed-confusables = ["−", "×", "–"]

[tool.ruff.lint.per-file-ignores]
# 데모·시각화 스크립트는 sys.path 조정 후 import 하므로 E402 허용
"tests/**" = ["E402"]
