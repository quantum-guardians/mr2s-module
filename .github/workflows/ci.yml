name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUFF_VERSION: "0.16.0"
  PYRIGHT_VERSION: "1.1.411"

jobs:
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"
      - name: Lint
        run: ruff check mr2s_module tests experiments
      - name: Format check
        run: ruff format --check mr2s_module tests experiments

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs 가 태그 기반 버전을 계산하므로 전체 이력이 필요
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with test extras
        run: pip install -e ".[test,experiments]" "pyright==${PYRIGHT_VERSION}"
      - name: Pyright
        run: pyright --pythonpath "$(which python)" mr2s_module tests experiments

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs 가 태그 기반 버전을 계산하므로 전체 이력이 필요
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with test extras
        run: pip install -e ".[test,experiments]"
      - name: Pytest (slow 제외)
        run: python -m pytest -m "not slow" --tb=short
